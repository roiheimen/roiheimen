name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup PostgreSQL
        run: |
          # Start PostgreSQL service
          sudo systemctl start postgresql
          sudo systemctl enable postgresql

          # Install wal2json extension
          sudo apt-get update
          sudo apt-get install -y postgresql-14-wal2json

          # Configure PostgreSQL for logical replication (required by PostGraphile)
          sudo -u postgres psql -c "ALTER SYSTEM SET wal_level = logical;"
          sudo -u postgres psql -c "ALTER SYSTEM SET max_wal_senders = 10;"
          sudo -u postgres psql -c "ALTER SYSTEM SET max_replication_slots = 10;"
          sudo systemctl restart postgresql

          # Create application database user
          sudo -u postgres psql -c "CREATE USER roiheimen_postgraphile WITH PASSWORD 'xyz' SUPERUSER;"

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          cd pkg/server && yarn install --frozen-lockfile
          cd ../web && yarn install --frozen-lockfile
          cd ../../e2e && yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          cd e2e
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: yarn test:e2e
        env:
          CI: true
          DATABASE_URL: postgres://roiheimen_postgraphile:xyz@localhost/roiheimen_test
          OWNER_DATABASE_URL: postgres://postgres@localhost/roiheimen_test
          NODE_ENV: test
          PGHOST: localhost
          PGPORT: 5432

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: e2e/test-results/
          retention-days: 7
