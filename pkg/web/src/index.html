<!DOCTYPE html>
<head>
<meta charset=utf8>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roiheimen - Taleliste og avroysting for demokratiske mote</title>
<meta name="description" content="Roiheimen gjer det enkelt a halda styr pa talelista og gjennomfora avroysting pa mote. Brukt av MDG, Noregs Mallag og mange fleire.">
<link rel=stylesheet href=style.css>
<script type=module src=/comp/landing-page.js></script>
<style>
body {
  background: #fefbf8;
  margin: 0;
  padding: 0;
}
</style>
<script>
// Redirect to dashboard if logged in with user account
(function() {
  try {
    var creds = JSON.parse(localStorage.getItem('creds') || '{}');
    if (creds.jwt && !location.search.includes('logout')) {
      var payload = JSON.parse(atob(creds.jwt.split('.')[1]));
      if (payload.email) {
        location.replace('/oversikt.html');
      }
    }
  } catch (e) {
    // Ignore errors - JWT might be malformed or old format
  }
})();
</script>
</head>
<body>
  <roi-landing-page></roi-landing-page>
</body>
